name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show package identity
        run: node -p "const p=require('./package.json'); p.name + ' ' + p.version + ' files=' + (p.files||[]).join(',')"

      - name: JS syntax check
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            node --check "$f"
            n=$((n+1))
          done < <(find . \( -name .git -o -name node_modules \) -prune -o -type f -name "*.js" -print)
          echo "checked $n js files"

      - name: Pack tarball
        run: |
          set -e
          # --ignore-scripts: repos ship prebuilt dist/, no tsc in CI install
          npm pack --ignore-scripts
          ls -la ./*.tgz

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NAME=$(node -p "require('./package.json').name")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" ./*.tgz --clobber
          else
            gh release create "$TAG" ./*.tgz --title "$NAME $TAG" --generate-notes
          fi
